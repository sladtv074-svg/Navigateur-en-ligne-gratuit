<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WebWorld</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="topbar">
    <div class="logo">🌐 WebWorld</div>

    <div class="top-actions">
      <button id="historyButton" title="Historique">🕘</button>
      <button id="privateButton" title="Mode privé">🕶️ Privé</button>
      <button id="newTabButton" title="Nouvel onglet">＋</button>
    </div>
  </header>

  <nav id="tabsBar" class="tabs-bar"></nav>

  <main>
    <section class="navigation-bar">
      <button id="backButton" title="Retour">←</button>
      <button id="forwardButton" title="Suivant">→</button>
      <button id="reloadButton" title="Actualiser">⟳</button>
      <button id="homeButton" title="Accueil">⌂</button>

      <input
        id="addressInput"
        type="text"
        placeholder="Rechercher ou saisir une adresse..."
        autocomplete="off"
      >

      <button id="goButton">Aller</button>
    </section>

    <section id="homePage" class="home-page">
      <h1>Bienvenue sur WebWorld</h1>
      <p>Un portail web avec onglets, historique et mode privé.</p>

      <div class="search-box">
        <select id="searchEngine">
          <option value="https://www.google.com/search?q=">Google</option>
          <option value="https://www.bing.com/search?q=">Bing</option>
          <option value="https://duckduckgo.com/?q=">DuckDuckGo</option>
          <option value="https://search.yahoo.com/search?p=">Yahoo</option>
          <option value="https://www.ecosia.org/search?q=">Ecosia</option>
        </select>

        <input
          id="homeSearchInput"
          type="search"
          placeholder="Effectuer une recherche..."
        >

        <button id="homeSearchButton">Rechercher</button>
      </div>

      <div class="quick-links">
        <a href="https://www.wikipedia.org" target="_blank" rel="noopener">
          Wikipédia
        </a>

        <a href="https://www.youtube.com" target="_blank" rel="noopener">
          YouTube
        </a>

        <a href="https://github.com" target="_blank" rel="noopener">
          GitHub
        </a>

        <a href="https://www.reddit.com" target="_blank" rel="noopener">
          Reddit
        </a>
      </div>
    </section>

    <section id="historyPanel" class="history-panel hidden">
      <div class="panel-heading">
        <h2>Historique</h2>
        <button id="clearHistoryButton">Effacer</button>
      </div>

      <div id="historyList"></div>
    </section>

    <section id="browserPage" class="browser-page hidden">
      <div id="frameNotice" class="frame-notice">
        Certains sites refusent l’affichage intégré.
        Utilise le bouton d’ouverture externe si nécessaire.
      </div>

      <iframe
        id="browserFrame"
        title="Page web"
        sandbox="allow-forms allow-modals allow-popups allow-presentation allow-same-origin allow-scripts"
      ></iframe>

      <button id="externalButton" class="external-button">
        ↗ Ouvrir cette page dans le navigateur
      </button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
